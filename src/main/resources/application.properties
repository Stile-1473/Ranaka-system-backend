

# Application name
spring.application.name=ranaka

# Server port is set to 5005
server.port=${SERVER_PORT:10000}

# Database
# Local development defaults to MySQL.
# Hosted environments can override with either:
# - SPRING_DATASOURCE_URL
# - JDBC_DATABASE_URL
spring.datasource.url=${SPRING_DATASOURCE_URL:${JDBC_DATABASE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:zero_trust}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Harare}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${JDBC_DATABASE_USERNAME:${PGUSER:${DB_USERNAME:ghost1473}}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${JDBC_DATABASE_PASSWORD:${PGPASSWORD:${DB_PASSWORD:ghost1473}}}}

#JPA

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

#Upload of files config here



#Secret Key

jwt.secret=${JWT_SECRET:dev-only-change-me-in-production}
jwt.expiration=86400000

#Email Configuration

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Bootstrap / seed controls
# demo    -> local demo accounts + sample workflow requests
# minimal -> only core test users, no sample requests
# off     -> no seeding at startup
app.bootstrap.mode=${APP_BOOTSTRAP_MODE:demo}

# Set to true for one deploy only when you want to clear old workflow demo/test data.
app.bootstrap.reset=${APP_BOOTSTRAP_RESET:false}

# Default password applied only when a seeded user is created for the first time.
app.bootstrap.default-password=${APP_BOOTSTRAP_DEFAULT_PASSWORD:Password@123}

# Expo push notification delivery
expo.push.url=${EXPO_PUSH_URL:https://exp.host/--/api/v2/push/send}
expo.push.access-token=${EXPO_PUSH_ACCESS_TOKEN:}
