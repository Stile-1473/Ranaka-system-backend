# In tests we use an in-memory H2 database so the backend can boot without MySQL.
spring.datasource.url=jdbc:h2:mem:ranaka_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Recreate schema for each test run to keep tests isolated and predictable.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Mail is pointed at a harmless local placeholder during tests.
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test
# This secret is only for automated test bootstrapping.
jwt.secret=test-secret-key-for-spring-boot-tests-only
# Random port avoids clashes with any dev server already running locally.
server.port=0
